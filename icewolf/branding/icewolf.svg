<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="orb" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1b4f8f"/>
      <stop offset="70%" stop-color="#0a2348"/>
      <stop offset="100%" stop-color="#040f22"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2fbff"/>
      <stop offset="55%" stop-color="#a9dcff"/>
      <stop offset="100%" stop-color="#4fa3e8"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cc4ff"/>
      <stop offset="100%" stop-color="#2a6fc0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f3ff"/>
      <stop offset="50%" stop-color="#5fb4ff"/>
      <stop offset="100%" stop-color="#1d5fb0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- frozen orb -->
  <circle cx="256" cy="256" r="236" fill="url(#orb)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring)" stroke-width="14"/>

  <!-- ice shards around the rim -->
  <g fill="#bfe6ff" opacity="0.85">
    <polygon points="256,8 270,58 256,48 242,58"/>
    <polygon points="430,82 410,128 404,112 388,118"/>
    <polygon points="82,82 124,118 108,112 102,128"/>
    <polygon points="504,256 454,270 464,256 454,242"/>
    <polygon points="8,256 58,242 48,256 58,270"/>
  </g>

  <!-- wolf head, facing forward -->
  <g filter="url(#glow)">
    <!-- ears -->
    <polygon points="150,92 214,190 140,214" fill="url(#fur)"/>
    <polygon points="362,92 298,190 372,214" fill="url(#fur)"/>
    <polygon points="160,124 200,190 156,200" fill="url(#shade)"/>
    <polygon points="352,124 312,190 356,200" fill="url(#shade)"/>
    <!-- head / mane -->
    <polygon points="256,150 344,180 392,250 370,320 318,360 256,446 194,360 142,320 120,250 168,180" fill="url(#fur)"/>
    <!-- cheek frost tufts -->
    <polygon points="120,250 84,300 142,320" fill="#d6f0ff"/>
    <polygon points="392,250 428,300 370,320" fill="#d6f0ff"/>
    <!-- facial shading (crystal facets) -->
    <polygon points="256,150 300,230 256,300 212,230" fill="#e9f8ff"/>
    <polygon points="212,230 256,300 194,360 168,280" fill="#9fd4ff"/>
    <polygon points="300,230 256,300 318,360 344,280" fill="#7fc0f5"/>
    <!-- muzzle -->
    <polygon points="256,300 290,360 256,430 222,360" fill="#cdeeff"/>
    <polygon points="238,404 274,404 256,430" fill="#0a2348"/>
    <!-- eyes, glowing ice -->
    <polygon points="186,246 230,256 196,272" fill="#00e5ff"/>
    <polygon points="326,246 282,256 316,272" fill="#00e5ff"/>
    <polygon points="200,252 222,257 204,264" fill="#ffffff"/>
    <polygon points="312,252 290,257 308,264" fill="#ffffff"/>
    <!-- brow frost crown -->
    <polygon points="256,150 270,118 256,128 242,118" fill="#ffffff"/>
  </g>
</svg>
