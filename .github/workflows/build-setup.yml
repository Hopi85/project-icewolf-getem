name: Build Icewolf Getem Edition

on:
  workflow_dispatch:          # "Run workflow" button on GitHub
    inputs:
      release_tag:
        description: 'Attach the files to this existing release (e.g. v1.1). Leave empty for a test build.'
        required: false
        default: ''
  release:
    types: [published]        # publishing a release builds it and attaches the files
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 2'      # weekly rebuild so the embedded LibreWolf engine stays current

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Icewolf Getem Edition (installer + portable)
        id: build
        shell: powershell
        run: ./build.ps1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Icewolf-Getem-Edition-${{ steps.build.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    # Runs for a published release, or for "Run workflow" with a release tag filled in.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to attach files to the release - only in this job
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Icewolf-Getem-Edition-${{ needs.build.outputs.version }}
          path: dist

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          ENGINE: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Built automatically for $TAG on LibreWolf engine $ENGINE.

          - **Installer:** run the .exe. Windows may show "Windows protected your PC": click *More info* -> *Run anyway* (the setup is not code-signed).
          - **Portable:** extract the .zip anywhere and start Icewolf.exe.
          - **Getem** needs Python 3.10+ from python.org ("Add Python to PATH"). Use it only for private copies of content you're allowed to download.
          - Each file has a .sha256 file to check that the download wasn't altered.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Icewolf Getem Edition $TAG" --notes-file notes.md
          fi
