name: Build Icewolf Getem Edition

on:
  workflow_dispatch:          # "Run workflow" button on GitHub
  push:
    branches: [main]
    tags: ['v*']              # a version tag (e.g. v1.0) also publishes a release
  schedule:
    - cron: '23 4 * * 2'      # weekly rebuild so the embedded LibreWolf engine stays current

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Icewolf Getem Edition (setup + portable, with and without Getem)
        id: build
        shell: powershell
        run: ./build.ps1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Icewolf-Getem-Edition-${{ steps.build.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    # Only for version tags: creates a GitHub release with all built files attached.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to create the release - only in this job
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Icewolf-Getem-Edition-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ENGINE: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Built automatically from tag $TAG on LibreWolf engine $ENGINE.

          - **Installer:** run the .exe. Windows may show "Windows protected your PC": click *More info* -> *Run anyway* (the setup is not code-signed).
          - **Portable:** extract the .zip anywhere and start Icewolf.exe.
          - **Getem versions** (files with "Getem" in the name) need Python 3.10+ from python.org ("Add Python to PATH"). Use Getem only for private copies of content you're allowed to download.
          - Each file has a .sha256 file to check that the download wasn't altered.
          EOF
          # A release created by hand on GitHub gets the files attached; otherwise a new one is created.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Icewolf Getem Edition $TAG" --notes-file notes.md
          fi
